<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="https://cdn.luogu.com.cn/upload/image_hosting/5bhl3tn0.png" type="image/png" sizes="32x32">
    <meta charset="utf-8">
    <title>登录</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ========== 本地字体引入（与本文件同目录） ========== */
        /* 字体只应用于 class="qttf" 的 div，用法：<div class="qttf">文字</div> */
        @font-face {
            font-family: "iasans";
            src: url("ia-11152edit.ttf") format("truetype");
            font-display: swap;
        }

        /* ========== 主题变量：清新简约（与整站一致） ========== */
        :root {
            --bg: #f5f9f7;
            --card: #ffffff;
            --border: #e4efea;
            --text: #3b4a45;
            --text-strong: #24352f;
            --text-sub: #8fa39c;
            --accent: #46b39a;
            --accent-deep: #2e8a76;
            --accent-soft: #eaf6f2;
        }

        /* ========== 全局重置与基础配置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        /* 自定义 TTF 字体：只通过 <div class="qttf"> 使用，不全局套用 */
        .qttf {
            font-family: "iasans", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        ::selection {
            background: rgba(70, 179, 154, 0.18);
        }

        /* ========== 站点头部 ========== */
        header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 6px;
            color: var(--text-strong);
            margin: 26px 0 22px;
        }

        header::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* ========== 主体卡片 ========== */
        main {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(60, 110, 95, 0.06);
            padding: 40px 44px 44px;
            width: 100%;
            max-width: 780px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        /* ========== 返回首页按钮（胶囊形） ========== */
        .back-btn {
            display: inline-block;
            color: var(--accent-deep);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 22px;
            padding: 6px 14px;
            border-radius: 999px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            color: #ffffff;
            background: var(--accent);
        }

        /* ========== 大标题 / 副标题 ========== */
        .doc-title {
            font-size: 30px;
            color: var(--text-strong);
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 10px;
        }

        .doc-subtitle {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.7;
            text-align: center;
            margin-bottom: 26px;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 28px;
        }

        /* ========== 表单容器（居中收窄） ========== */
        .auth-box {
            max-width: 420px;
            margin: 0 auto;
        }

        /* 登录 / 注册切换 */
        .tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 26px;
        }

        .tab {
            font-family: inherit;
            font-size: 15px;
            color: var(--text-sub);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 4px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab:hover {
            color: var(--accent-deep);
        }

        .tab.active {
            color: var(--accent-deep);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* 输入项 */
        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: all 0.25s ease;
        }

        .field input:focus {
            border-color: var(--accent);
            background: #ffffff;
        }

        /* 主按钮 */
        .btn-primary {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 15px;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            background: var(--accent-deep);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 次要链接按钮 */
        .btn-link {
            display: block;
            margin: 18px auto 0;
            font-family: inherit;
            font-size: 13px;
            color: var(--accent-deep);
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 1px solid rgba(70, 179, 154, 0.4);
            padding-bottom: 2px;
        }

        .btn-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* 提示信息 */
        .msg {
            min-height: 20px;
            font-size: 13px;
            line-height: 1.6;
            margin: 2px 0 14px;
            color: var(--text-sub);
        }

        .msg.error {
            color: #c0392b;
        }

        .msg.success {
            color: var(--accent-deep);
        }

        /* ========== 已登录视图 ========== */
        .user-card {
            text-align: center;
            padding: 6px 0 26px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            margin: 0 auto 14px;
        }

        .user-email {
            font-size: 16px;
            color: var(--text-strong);
            font-weight: 600;
            word-break: break-all;
        }

        .user-id {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
            word-break: break-all;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* ========== 个人资料编辑 ========== */
        .profile-form {
            margin-top: 4px;
        }

        .field textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            resize: vertical;
            transition: all 0.25s ease;
        }

        .field textarea:focus {
            border-color: var(--accent);
            background: #ffffff;
        }

        .btn-secondary {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-family: inherit;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            color: var(--accent-deep);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        /* ========== 私信 ========== */
        .dm-entry {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .dm-entry:hover { background: var(--accent-deep); transform: translateY(-1px); }
        .dm-badge {
            display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px;
            font-size: 11px; line-height: 18px; text-align: center;
            color: #ffffff; background: #e05a4f; border-radius: 999px;
        }

        .dm-panel {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
        }
        .dm-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--accent-soft);
            border-bottom: 1px solid var(--border);
        }
        .dm-head-title { font-size: 15px; font-weight: 600; color: var(--text-strong); }
        .dm-close {
            background: none; border: none; color: var(--text-sub);
            font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
        }
        .dm-close:hover { color: var(--accent-deep); }
        .dm-body { display: flex; min-height: 320px; }
        .dm-users {
            width: 40%; max-width: 180px; border-right: 1px solid var(--border);
            overflow-y: auto; max-height: 400px; background: #fbfdfc;
        }
        .dm-user {
            display: flex; align-items: center; gap: 8px; padding: 11px 12px;
            cursor: pointer; border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }
        .dm-user:hover { background: var(--accent-soft); }
        .dm-user.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
        .dm-user-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dm-chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .dm-messages { flex: 1; overflow-y: auto; max-height: 340px; padding: 14px; }
        .dm-empty { color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 120px; }
        .dm-msg { margin-bottom: 12px; display: flex; }
        .dm-msg.mine { justify-content: flex-end; }
        .dm-bubble {
            max-width: 78%; padding: 8px 12px; border-radius: 14px;
            font-size: 13.5px; line-height: 1.6; word-break: break-word; white-space: pre-wrap;
            background: #f0f4f2; color: var(--text); border-bottom-left-radius: 4px;
        }
        .dm-msg.mine .dm-bubble {
            background: var(--accent); color: #ffffff; border-radius: 14px; border-bottom-right-radius: 4px;
        }
        .dm-time { display: block; font-size: 10.5px; opacity: 0.65; margin-top: 3px; }
        .dm-compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
        .dm-compose input {
            flex: 1; min-width: 0; padding: 9px 12px; font-size: 13px; font-family: inherit;
            border: 1px solid var(--border); border-radius: 999px; outline: none; background: var(--bg);
        }
        .dm-compose input:focus { border-color: var(--accent); }
        .dm-send {
            padding: 8px 16px; font-size: 13px; color: #fff; background: var(--accent);
            border: none; border-radius: 999px; cursor: pointer; transition: background 0.2s ease;
        }
        .dm-send:hover { background: var(--accent-deep); }
        .dm-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .dm-tip { font-size: 12px; color: var(--text-sub); padding: 6px 16px 12px; }

        .hidden {
            display: none !important;
        }

        /* ========== 页脚 ========== */
        footer {
            color: #a7b5b0;
            font-size: 12.5px;
            margin-top: auto;
            padding: 16px 0;
            letter-spacing: 1px;
        }

        /* ========== 移动端适配 ========== */
        @media (max-width: 600px) {
            body {
                padding: 16px 12px;
            }

            header {
                font-size: 17px;
                letter-spacing: 4px;
            }

            main {
                padding: 30px 22px 34px;
                border-radius: 14px;
            }

            .doc-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 站点头部（可自行修改站点名） -->
    <header>Q 的网站</header>

    <main>
        <!-- 返回首页 -->
        <a href="/" class="back-btn">← 返回首页</a>

        <h1 class="doc-title">登录</h1>
        <p class="doc-subtitle">用邮箱登录，管理你的专属内容</p>

        <div class="divider"></div>

        <!-- 未登录：登录 / 注册表单 -->
        <div class="auth-box" id="authView">
            <div class="tabs">
                <button type="button" class="tab active" data-mode="login">登录</button>
                <button type="button" class="tab" data-mode="register">注册</button>
            </div>

            <form id="authForm">
                <div class="field">
                    <label for="email">邮箱</label>
                    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" type="password" placeholder="至少 6 位" autocomplete="current-password" required>
                </div>
                <p id="msg" class="msg" role="status"></p>
                <button type="submit" id="submitBtn" class="btn-primary">登录</button>
            </form>

            <button type="button" id="otpBtn" class="btn-link">用邮件验证码登录（免密码）</button>
        </div>

        <!-- 已登录：个人资料 -->
        <div class="auth-box hidden" id="userView">
            <div class="user-card">
                <div class="avatar" id="avatar">Q</div>
                <p class="user-email" id="userEmail"></p>
                <p class="user-id" id="userId"></p>
            </div>

            <div class="profile-form">
                <a href="profile.html" class="btn-secondary">修改资料</a>
                <button type="button" id="dmEntry" class="dm-entry">私信<span id="dmBadge" class="dm-badge hidden">0</span></button>
                <button type="button" id="logoutBtn" class="btn-secondary">退出登录</button>

                <!-- 私信面板 -->
                <div class="dm-panel hidden" id="dmPanel">
                    <div class="dm-head">
                        <span class="dm-head-title">私信</span>
                        <button type="button" class="dm-close" id="dmClose" title="收起">×</button>
                    </div>
                    <div class="dm-body">
                        <div class="dm-users" id="dmUsers"></div>
                        <div class="dm-chat">
                            <div class="dm-messages" id="dmMessages">
                                <div class="dm-empty" id="dmEmpty">从左侧选择一位用户开始对话</div>
                            </div>
                            <div class="dm-compose hidden" id="dmCompose">
                                <input id="dmInput" type="text" placeholder="输入消息…" maxlength="1000">
                                <button type="button" class="dm-send" id="dmSend">发送</button>
                            </div>
                        </div>
                    </div>
                    <div class="dm-tip">仅你与对方可见</div>
                </div>
            </div>
        </div>
    </main>

    <footer>© 2026 Q 的网站</footer>

    <!-- Supabase 官方 JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== 在这里填入你自己的 Supabase 项目信息 ==========
        const SUPABASE_URL = "https://qaqaeijbozwtlvxgckaz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_rzCtAhhsB6--u_0U0lNE4w_BgDGUApS";
        // ==========================================================

        const isConfigured =
            !SUPABASE_URL.includes("your-project") &&
            !SUPABASE_ANON_KEY.includes("your-anon-key");

        let sb = null;
        if (isConfigured && window.supabase) {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const authView = document.getElementById("authView");
        const userView = document.getElementById("userView");
        const authForm = document.getElementById("authForm");
        const emailEl = document.getElementById("email");
        const passwordEl = document.getElementById("password");
        const msgEl = document.getElementById("msg");
        const submitBtn = document.getElementById("submitBtn");
        const otpBtn = document.getElementById("otpBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const userEmailEl = document.getElementById("userEmail");
        const userIdEl = document.getElementById("userId");
        const avatarEl = document.getElementById("avatar");

        let mode = "login";
        let currentUser = null;

        // ========== 私信 ==========
        const dmEntry = document.getElementById("dmEntry");
        const dmBadge = document.getElementById("dmBadge");
        const dmPanel = document.getElementById("dmPanel");
        const dmClose = document.getElementById("dmClose");
        const dmUsers = document.getElementById("dmUsers");
        const dmMessages = document.getElementById("dmMessages");
        const dmEmpty = document.getElementById("dmEmpty");
        const dmCompose = document.getElementById("dmCompose");
        const dmInput = document.getElementById("dmInput");
        const dmSend = document.getElementById("dmSend");

        let dmPeer = null;          // 当前对话对象 {id, nickname, email}
        let dmChannel = null;       // Supabase Realtime 频道
        let dmUsersLoaded = false;

        function dmName(p) {
            return (p && p.nickname) || (p && p.email ? p.email.split("@")[0] : "用户");
        }

        // 拉取未读私信数（发给当前用户且未读）
        async function dmRefreshBadge() {
            if (!sb || !currentUser) return;
            const { count, error } = await sb
                .from("messages")
                .select("id", { count: "exact", head: true })
                .eq("receiver_id", currentUser.id)
                .eq("read", false);
            if (error) return;
            if (count > 0) {
                dmBadge.textContent = count > 99 ? "99+" : String(count);
                dmBadge.classList.remove("hidden");
            } else {
                dmBadge.classList.add("hidden");
            }
        }

        // 加载用户列表（排除自己），显示昵称
        async function dmLoadUsers() {
            if (!sb || !currentUser || dmUsersLoaded) return;
            dmUsers.innerHTML = '<div class="dm-tip" style="padding:14px">加载中…</div>';
            const { data: profiles, error } = await sb
                .from("profiles")
                .select("id, nickname, avatar_url")
                .neq("id", currentUser.id)
                .order("nickname", { ascending: true });
            if (error) {
                dmUsers.innerHTML = '<div class="dm-tip" style="padding:14px">用户列表加载失败：' + error.message + '</div>';
                return;
            }
            dmUsersLoaded = true;
            dmUsers.innerHTML = "";
            if (!profiles || !profiles.length) {
                dmUsers.innerHTML = '<div class="dm-tip" style="padding:14px">还没有其他用户</div>';
                return;
            }
            profiles.forEach(p => {
                const div = document.createElement("div");
                div.className = "dm-user";
                div.dataset.id = p.id;
                const initial = (p.nickname || "U").charAt(0).toUpperCase();
                div.innerHTML = '<span class="avatar" style="width:30px;height:30px;font-size:13px;margin:0;flex:0 0 30px">' +
                    (p.avatar_url ? '<img src="' + p.avatar_url.replace(/"/g, "&quot;") + '" alt="">' : initial) + '</span>' +
                    '<span class="dm-user-name">' + dmName(p).replace(/</g, "&lt;") + '</span>';
                div.addEventListener("click", () => dmOpenChat({ id: p.id, nickname: p.nickname, email: null }));
                dmUsers.appendChild(div);
            });
        }

        // 打开与某人的对话
        async function dmOpenChat(peer) {
            dmPeer = peer;
            dmUsers.querySelectorAll(".dm-user").forEach(u => u.classList.toggle("active", u.dataset.id === peer.id));
            dmCompose.classList.remove("hidden");
            dmEmpty.classList.add("hidden");
            await dmLoadMessages();
            // 标记对方发来的消息为已读
            await sb.from("messages")
                .update({ read: true })
                .eq("sender_id", peer.id)
                .eq("receiver_id", currentUser.id)
                .eq("read", false);
            dmRefreshBadge();
        }

        // 加载与当前对象的聊天记录
        async function dmLoadMessages() {
            if (!sb || !currentUser || !dmPeer) return;
            const { data, error } = await sb
                .from("messages")
                .select("id, sender_id, receiver_id, content, created_at")
                .or("and(sender_id.eq." + currentUser.id + ",receiver_id.eq." + dmPeer.id + "),and(sender_id.eq." + dmPeer.id + ",receiver_id.eq." + currentUser.id + ")")
                .order("created_at", { ascending: true });
            if (error) {
                dmMessages.innerHTML = '<div class="dm-empty">消息加载失败：' + error.message + '</div>';
                return;
            }
            dmMessages.innerHTML = "";
            if (!data || !data.length) {
                dmMessages.innerHTML = '<div class="dm-empty">还没有消息，打个招呼吧</div>';
                return;
            }
            data.forEach(m => {
                const mine = m.sender_id === currentUser.id;
                const div = document.createElement("div");
                div.className = "dm-msg" + (mine ? " mine" : "");
                const time = (m.created_at || "").slice(5, 16).replace("T", " ");
                div.innerHTML = '<div class="dm-bubble">' + String(m.content).replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                    '<span class="dm-time">' + time + '</span></div>';
                dmMessages.appendChild(div);
            });
            dmMessages.scrollTop = dmMessages.scrollHeight;
        }

        // 订阅实时消息
        function dmSubscribe() {
            if (!sb || !currentUser || dmChannel) return;
            dmChannel = sb.channel("dm-" + currentUser.id)
                .on("postgres_changes", {
                    event: "INSERT", schema: "public", table: "messages",
                    filter: "receiver_id=eq." + currentUser.id
                }, payload => {
                    dmRefreshBadge();
                    if (dmPeer && payload.new.sender_id === dmPeer.id) dmLoadMessages();
                })
                .subscribe();
        }

        // 打开 / 收起私信面板
        dmEntry.addEventListener("click", async () => {
            const willOpen = dmPanel.classList.contains("hidden");
            dmPanel.classList.toggle("hidden", !willOpen);
            if (willOpen) {
                await dmLoadUsers();
                dmSubscribe();
                dmRefreshBadge();
            }
        });
        dmClose.addEventListener("click", () => dmPanel.classList.add("hidden"));

        // 发送消息
        dmSend.addEventListener("click", async () => {
            if (!sb || !currentUser || !dmPeer) return;
            const text = dmInput.value.trim();
            if (!text) return;
            dmSend.disabled = true;
            const { error } = await sb.from("messages").insert({
                sender_id: currentUser.id,
                receiver_id: dmPeer.id,
                content: text,
                read: false
            });
            dmSend.disabled = false;
            if (error) {
                dmInput.placeholder = "发送失败：" + error.message;
                return;
            }
            dmInput.value = "";
            dmLoadMessages();
        });
        dmInput.addEventListener("keydown", e => { if (e.key === "Enter") dmSend.click(); });

        // 拉取当前用户的资料用于头像显示（编辑已移到 profile.html）
        async function loadProfile(user) {
            if (!sb || !user) return;
            const { data } = await sb
                .from("profiles")
                .select("nickname, avatar_url")
                .eq("id", user.id)
                .maybeSingle();
            if (data) {
                updateAvatar(data.avatar_url, data.nickname, user.email);
            } else {
                avatarEl.textContent = (user.email || "Q").charAt(0).toUpperCase();
            }
        }

        // 更新头像显示：优先头像链接，其次昵称首字，最后邮箱首字
        function updateAvatar(avatarUrl, nickname, email) {
            avatarEl.innerHTML = "";
            if (avatarUrl) {
                const img = document.createElement("img");
                img.src = avatarUrl;
                img.alt = "头像";
                img.onerror = () => { avatarEl.textContent = (nickname || email || "Q").charAt(0).toUpperCase(); };
                avatarEl.appendChild(img);
            } else {
                avatarEl.textContent = (nickname || email || "Q").charAt(0).toUpperCase();
            }
        }

        function setMsg(text, type) {
            msgEl.textContent = text || "";
            msgEl.className = "msg" + (type ? " " + type : "");
        }

        // 切换 登录 / 注册
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                mode = tab.dataset.mode;
                document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
                submitBtn.textContent = mode === "login" ? "登录" : "注册";
                setMsg("");
            });
        });

        // 根据登录状态切换视图
        function renderUser(user) {
            currentUser = user;
            if (user) {
                authView.classList.add("hidden");
                userView.classList.remove("hidden");
                userEmailEl.textContent = user.email || "已登录用户";
                userIdEl.textContent = "ID: " + user.id;
                loadProfile(user);
                dmPanel.classList.add("hidden");
                dmUsersLoaded = false;
                dmRefreshBadge();
                dmSubscribe();
            } else {
                authView.classList.remove("hidden");
                userView.classList.add("hidden");
                if (dmChannel) { if (sb) sb.removeChannel(dmChannel); dmChannel = null; }
                dmPeer = null;
            }
        }

        // 邮箱 + 密码 登录 / 注册
        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!sb) {
                setMsg("请先在代码顶部填入 SUPABASE_URL 和 SUPABASE_ANON_KEY", "error");
                return;
            }

            const email = emailEl.value.trim();
            const password = passwordEl.value;
            setMsg("");
            submitBtn.disabled = true;

            try {
                if (mode === "login") {
                    const { error } = await sb.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    setMsg("登录成功", "success");
                } else {
                    const { error } = await sb.auth.signUp({ email, password });
                    if (error) throw error;
                    setMsg("注册成功，请查收验证邮件后登录（若后台已开启邮箱验证）", "success");
                }
            } catch (err) {
                setMsg(err.message || "操作失败，请稍后重试", "error");
            } finally {
                submitBtn.disabled = false;
            }
        });

        // 邮件验证码（免密码）登录
        otpBtn.addEventListener("click", async () => {
            if (!sb) {
                setMsg("请先在代码顶部填入 SUPABASE_URL 和 SUPABASE_ANON_KEY", "error");
                return;
            }
            const email = emailEl.value.trim();
            if (!email) {
                setMsg("请先填写邮箱", "error");
                return;
            }
            setMsg("");
            otpBtn.disabled = true;
            try {
                const { error } = await sb.auth.signInWithOtp({
                    email,
                    options: { emailRedirectTo: location.origin + location.pathname }
                });
                if (error) throw error;
                setMsg("登录链接已发送，请查收邮件并点击链接完成登录", "success");
            } catch (err) {
                setMsg(err.message || "发送失败，请稍后重试", "error");
            } finally {
                otpBtn.disabled = false;
            }
        });

        // 退出登录
        logoutBtn.addEventListener("click", async () => {
            if (!sb) return;
            await sb.auth.signOut();
            renderUser(null);
        });

        // 初始化登录状态
        if (sb) {
            sb.auth.getSession().then(({ data }) => renderUser(data.session?.user || null));
            sb.auth.onAuthStateChange((_event, session) => renderUser(session?.user || null));
        } else {
            setMsg(
                window.supabase
                    ? "请先在代码顶部填入你自己的 Supabase 项目 URL 和 anon key"
                    : "Supabase SDK 加载失败，请检查网络后刷新",
                "error"
            );
        }
    </script>
</body>
</html>
