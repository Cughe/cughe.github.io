<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>投稿审核 - Q 的网站</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face { font-family: "iasans"; src: url("ia-11152edit.ttf") format("truetype"); font-display: swap; }
        :root {
            --bg: #f5f9f7; --card: #ffffff; --border: #e4efea;
            --text: #3b4a45; --text-strong: #24352f; --text-sub: #8fa39c;
            --accent: #46b39a; --accent-deep: #2e8a76; --accent-soft: #eaf6f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
            background: var(--bg); min-height: 100vh; padding: 24px 16px;
            display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .qttf { font-family: "iasans", "Microsoft YaHei", "PingFang SC", sans-serif; }
        ::selection { background: rgba(70,179,154,0.18); }
        header { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600;
            letter-spacing: 6px; color: var(--text-strong); margin: 26px 0 22px; }
        header::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
        .account-btn { font-size: 13px; font-weight: 400; letter-spacing: 0; color: #fff; background: var(--accent);
            text-decoration: none; padding: 6px 16px; border-radius: 999px; margin-left: 14px; transition: all .25s ease; }
        .account-btn:hover { background: var(--accent-deep); transform: translateY(-1px); }
        main { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 6px 24px rgba(60,110,95,0.06); padding: 34px 40px; width: 100%; max-width: 820px; margin-bottom: 24px; }
        .back-btn { display: inline-block; color: var(--accent-deep); text-decoration: none; font-size: 14px;
            margin-bottom: 18px; padding: 6px 14px; border-radius: 999px; transition: all .25s ease; }
        .back-btn:hover { color: #fff; background: var(--accent); }
        .page-title { font-size: 24px; color: var(--text-strong); margin-bottom: 6px; font-weight: 700; letter-spacing: 1px; }
        .page-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; }
        .box { background: #fbfdfc; border: 1px solid var(--border); border-radius: 12px;
            padding: 16px 18px; margin-bottom: 16px; }
        .box-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .box-title { font-size: 17px; font-weight: 600; color: var(--text-strong); }
        .box-meta { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
        .box-summary { font-size: 13.5px; color: var(--text); margin-bottom: 12px; line-height: 1.6; }
        .box-body { font-size: 14px; line-height: 1.8; color: #4c6560; white-space: pre-wrap; word-break: break-word;
            max-height: 260px; overflow-y: auto; background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
        .tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #fff4e6; color: #b8860b; margin-left: 8px; }
        .actions { display: flex; gap: 10px; }
        .btn { font-size: 13px; padding: 8px 18px; border: none; border-radius: 999px; cursor: pointer; transition: all .25s ease; }
        .btn-pass { color: #fff; background: var(--accent); }
        .btn-pass:hover { background: var(--accent-deep); transform: translateY(-1px); }
        .btn-reject { color: #b8544b; background: #fdf0ef; }
        .btn-reject:hover { background: #f9dcd9; }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .notice { background: var(--accent-soft); color: var(--accent-deep); padding: 14px 16px;
            border-radius: 12px; font-size: 14px; line-height: 1.8; text-align: center; }
        .denied { background: #fdf0ef; color: #b8544b; padding: 16px 18px; border-radius: 12px;
            font-size: 14.5px; line-height: 1.8; text-align: center; }
        .empty { text-align: center; color: var(--text-sub); padding: 30px 0; font-size: 14px; }
        .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            background: var(--text-strong); color: #fff; font-size: 13.5px; padding: 10px 20px;
            border-radius: 999px; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
        .toast.show { opacity: 1; }
        footer { color: #a7b5b0; font-size: 12.5px; margin-top: auto; padding: 16px 0; letter-spacing: 1px; }
        @media (max-width: 600px) {
            body { padding: 16px 12px; }
            header { font-size: 17px; letter-spacing: 4px; }
            main { padding: 24px 20px; border-radius: 14px; }
            .page-title { font-size: 21px; }
            .box-head { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <span>Q 的网站</span>
        <a id="accountBtn" class="account-btn" href="login.html">登录</a>
    </header>

    <main>
        <a href="/" class="back-btn">← 返回首页</a>
        <h1 class="page-title"><span class="qttf">投稿审核</span></h1>
        <p class="page-sub">仅管理员可见。通过的稿件会自动展示在文章广场。</p>

        <div id="deniedBox" class="denied" style="display:none">
            当前账号无审核权限。请使用管理员邮箱登录。
        </div>
        <div id="loginBox" class="notice" style="display:none">
            请先<a href="login.html" style="color:var(--accent-deep);font-weight:600">登录</a>管理员账号。
        </div>
        <div id="reviewBox" style="display:none">
            <div id="list"></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
    <footer>© 2026 Q 的网站</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== 管理员邮箱白名单：改成你自己的邮箱（与 SQL 策略保持一致） =====
        const ADMIN_EMAILS = ["cyq142857@outlook.com"];

        const SUPABASE_URL = "https://qaqaeijbozwtlvxgckaz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_rzCtAhhsB6--u_0U0lNE4w_BgDGUApS";
        const sb = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

        function toast(text) {
            const t = document.getElementById("toast");
            t.textContent = text; t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 1800);
        }

        async function load() {
            if (!sb) return;
            const btn = document.getElementById("accountBtn");
            const { data } = await sb.auth.getSession();
            const user = data.session?.user;
            if (!user) { document.getElementById("loginBox").style.display = "block"; return; }
            const email = (user.email || "").toLowerCase();
            btn.textContent = email.split("@")[0]; btn.title = email;
            if (!ADMIN_EMAILS.map(e => e.toLowerCase()).includes(email)) {
                document.getElementById("deniedBox").style.display = "block";
                return;
            }
            document.getElementById("reviewBox").style.display = "block";
            const { data: rows, error } = await sb.from("submissions")
                .select("id, title, category, summary, content, author_name, author_email, created_at")
                .eq("status", "pending").order("created_at", { ascending: true });
            const list = document.getElementById("list");
            if (error) { list.innerHTML = '<div class="empty">读取失败：' + esc(error.message) + '<br>请确认数据表已创建。</div>'; return; }
            if (!rows || !rows.length) { list.innerHTML = '<div class="empty">暂无待审核的稿件 ✓</div>'; return; }
            list.innerHTML = "";
            rows.forEach(row => {
                const who = row.author_name || (row.author_email ? row.author_email.split("@")[0] : "匿名");
                const date = (row.created_at || "").slice(0, 10);
                const div = document.createElement("div");
                div.className = "box";
                div.innerHTML =
                    '<div class="box-head"><div><div class="box-title">' + esc(row.title) +
                        '<span class="tag">待审核</span></div>' +
                        '<div class="box-meta">' + esc(date) + ' · ' + esc(row.category || "投稿") + ' · 作者：' + esc(who) + ' · ' + esc(row.author_email || "") + '</div></div></div>' +
                    (row.summary ? '<div class="box-summary">简介：' + esc(row.summary) + '</div>' : '') +
                    '<div class="box-body">' + esc(row.content || "") + '</div>' +
                    '<div class="actions">' +
                        '<button class="btn btn-pass" data-id="' + esc(row.id) + '" data-act="approved">通过并发布</button>' +
                        '<button class="btn btn-reject" data-id="' + esc(row.id) + '" data-act="rejected">拒绝</button>' +
                    '</div>';
                list.appendChild(div);
            });
            list.querySelectorAll("button").forEach(b => b.addEventListener("click", async function () {
                const id = this.getAttribute("data-id"), act = this.getAttribute("data-act");
                this.disabled = true;
                const { error } = await sb.from("submissions").update({ status: act, reviewed_at: new Date().toISOString() }).eq("id", id);
                if (error) { toast("操作失败：" + error.message); this.disabled = false; }
                else { toast(act === "approved" ? "已通过，文章已上线" : "已拒绝"); this.closest(".box").remove();
                    if (!document.querySelector("#list .box")) document.getElementById("list").innerHTML = '<div class="empty">暂无待审核的稿件 ✓</div>'; }
            }));
        }
        load();
    </script>
</body>
</html>
